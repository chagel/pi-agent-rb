AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'vendor/**/*'
    - 'tmp/**/*'
    - 'pkg/**/*'

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

# RSpec describe blocks are inherently long; constants inside describe blocks
# are a common spec idiom (heredocs for stub scripts, fixture payloads).
Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - '*.gemspec'

Metrics/MethodLength:
  Max: 15
  Exclude:
    - 'spec/**/*'

# Session is a thin 1:1 wrapper over the pi RPC command surface, which grows
# as upstream adds commands (get_entries/get_tree in pi 0.80.3, etc.).
# Client carries the transport lifecycle state machine (request correlation,
# death notification, clean-close semantics), whose small documented methods
# are worth more than the line budget.
Metrics/ClassLength:
  Max: 230

# Keyword arguments are self-documenting; they don't carry the
# positional-argument readability cost this cop guards against.
Metrics/ParameterLists:
  CountKeywordArgs: false

# Session methods (set_model, set_thinking, get_state) deliberately mirror
# the pi RPC command names so the Ruby API maps 1:1 to the wire protocol.
Naming/AccessorMethodName:
  Exclude:
    - 'lib/pi_agent/session.rb'

Lint/ConstantDefinitionInBlock:
  Exclude:
    - 'spec/**/*'

Lint/EmptyBlock:
  Exclude:
    - 'spec/**/*'
