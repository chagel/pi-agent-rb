AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'vendor/**/*'
    - 'tmp/**/*'
    - 'pkg/**/*'

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

# RSpec describe blocks are inherently long; constants inside describe blocks
# are a common spec idiom (heredocs for stub scripts, fixture payloads).
Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - '*.gemspec'

Metrics/MethodLength:
  Max: 15
  Exclude:
    - 'spec/**/*'

Metrics/ClassLength:
  Max: 150

# Keyword arguments are self-documenting; they don't carry the
# positional-argument readability cost this cop guards against.
Metrics/ParameterLists:
  CountKeywordArgs: false

# Session methods (set_model, set_thinking, get_state) deliberately mirror
# the pi RPC command names so the Ruby API maps 1:1 to the wire protocol.
Naming/AccessorMethodName:
  Exclude:
    - 'lib/pi_agent/session.rb'

Lint/ConstantDefinitionInBlock:
  Exclude:
    - 'spec/**/*'

Lint/EmptyBlock:
  Exclude:
    - 'spec/**/*'
